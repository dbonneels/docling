services:
  docling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docling
    ports:
      - "127.0.0.1:8502:8501"  # bound to localhost, exposed via Apache reverse proxy
    volumes:
      # Persist Docling/HuggingFace model downloads across container restarts.
      - ./model-cache:/app/model-cache
    restart: unless-stopped
    # One PDF conversion peaks at ~1.9 GB RSS. Cap the container so a spike
    # OOM-kills only this container (which then restarts) instead of the host.
    mem_limit: 2500m
    memswap_limit: 2500m
    environment:
      # Serve the app under https://bonneels.net/docling-demo/ (Apache proxy)
      STREAMLIT_SERVER_BASE_URL_PATH: docling-demo
      # Accept the WebSocket handshake coming from the portfolio origin
      STREAMLIT_SERVER_CORS_ALLOWED_ORIGINS: "https://bonneels.net https://www.bonneels.net"
      # Model cache location (see volume above)
      HF_HOME: /app/model-cache/huggingface
      TORCH_HOME: /app/model-cache/torch
      DOCLING_CACHE_PATH: /app/model-cache/docling
      # Keep torch from oversubscribing the 2 vCPUs
      OMP_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/docling-demo/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
